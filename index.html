<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <link rel="icon" type="image/png" href="favicon.png">
  
  <title>Morphing Sphere</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      touch-action: none;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #topBar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    #titleWrap {
      text-align: center;
    }

    #title {
      margin: 0;
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }

    #subtitle {
      margin-top: 9px;
      color: rgba(255, 255, 255, 0.52);
      font-size: clamp(12px, 2.6vw, 15px);
      letter-spacing: 0.1px;
    }

    #exportButton {
      position: absolute;
      top: 0;
      right: 0;
      height: 46px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 14px;
      background: rgba(18, 18, 18, 0.88);
      color: rgba(255, 255, 255, 0.82);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.025),
        0 0 25px rgba(100, 90, 255, 0.10);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: auto;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        background 0.15s ease;
    }

    #exportButton:hover:not(:disabled) {
      background: rgba(30, 30, 30, 0.94);
      transform: translateY(-1px);
    }

    #exportButton:active:not(:disabled) {
      transform: translateY(1px);
    }

    #exportButton:disabled {
      opacity: 0.38;
      cursor: default;
    }

    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% - 150px));
      padding: 7px 13px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.58);
      color: rgba(255, 255, 255, 0.55);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #signature {
      position: absolute;
      left: 22px;
      bottom: 21px;
      color: rgba(255, 255, 255, 0.27);
      font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;
      font-size: 15px;
      letter-spacing: 0.2px;
      transform: rotate(-4deg);
      user-select: none;
    }

    #signature::after {
      content: "";
      display: block;
      width: 74px;
      height: 1px;
      margin-top: -2px;
      margin-left: 2px;
      background: rgba(255, 255, 255, 0.19);
      transform: rotate(-2deg);
    }

    #inputWrap {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(650px, calc(100% - 36px));
      height: 58px;
      display: flex;
      align-items: center;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 18px;
      background: rgba(14, 14, 14, 0.78);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.025),
        0 10px 40px rgba(0, 0, 0, 0.30);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: auto;
    }

    #textInput {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 13px;
      border: 0;
      outline: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.90);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
    }

    #textInput::placeholder {
      color: rgba(255, 255, 255, 0.32);
    }

    #createButton {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border: 0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      color: #090909;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    #createButton:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    #createButton:active {
      transform: translateY(1px);
    }

    @media (max-width: 600px) {
      #topBar {
        top: 17px;
        left: 14px;
        right: 14px;
      }

      #title {
        font-size: 27px;
      }

      #subtitle {
        font-size: 12px;
        margin-top: 7px;
      }

      #exportButton {
        height: 40px;
        padding: 0 12px;
        border-radius: 12px;
        font-size: 12px;
      }

      #status {
        transform: translate(-50%, calc(-50% - 125px));
      }

      #inputWrap {
        bottom: 17px;
        width: calc(100% - 28px);
        height: 55px;
        border-radius: 17px;
      }

      #createButton {
        width: 43px;
        height: 43px;
        flex-basis: 43px;
      }

      #signature {
        left: 15px;
        bottom: 82px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div id="ui">

    <div id="topBar">

      <div id="titleWrap">
        <h1 id="title">Morphing Sphere</h1>
        <div id="subtitle">Particles become whatever you type.</div>
      </div>

      <button
        id="exportButton"
        type="button"
        aria-label="Download particle text as PNG"
        disabled
      >
        ↓ PNG
      </button>

    </div>

    <div id="status">SPHERE</div>

    <div id="signature">
      PeppermintGrave
    </div>

    <div id="inputWrap">

      <input
        id="textInput"
        type="text"
        autocomplete="off"
        autocapitalize="sentences"
        spellcheck="false"
        placeholder="Type something..."
        maxlength="80"
      >

      <button
        id="createButton"
        type="button"
        aria-label="Create text"
      >
        →
      </button>

    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>

  <script>
    const status = document.getElementById("status");
    const input = document.getElementById("textInput");
    const createButton = document.getElementById("createButton");
    const exportButton = document.getElementById("exportButton");

    let currentText = "";
    let textTargets = null;
    let morphing = false;
    let returnTimer = null;

    const isMobile = window.innerWidth < 600;

    let particleCount;

    const area = window.innerWidth * window.innerHeight;

    if (area < 300000) {
      particleCount = 7000;
    } else if (area < 600000) {
      particleCount = 8500;
    } else if (area < 1000000) {
      particleCount = 10500;
    } else {
      particleCount = 14000;
    }

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );

    let zoom = isMobile ? 29 : 25;

    camera.position.z = zoom;

    const geometry = new THREE.BufferGeometry();

    const positions = new Float32Array(
      particleCount * 3
    );

    function createSpherePositions() {
      for (let i = 0; i < particleCount; i++) {

        const i3 = i * 3;

        const phi =
          Math.acos(
            1 - 2 * (i + 0.5) / particleCount
          );

        const theta =
          Math.PI *
          (1 + Math.sqrt(5)) *
          i;

        const radius = 5.15;

        positions[i3] =
          radius *
          Math.sin(phi) *
          Math.cos(theta);

        positions[i3 + 1] =
          radius *
          Math.cos(phi);

        positions[i3 + 2] =
          radius *
          Math.sin(phi) *
          Math.sin(theta);
      }
    }

    createSpherePositions();

    geometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        positions,
        3
      )
    );

    const material = new THREE.PointsMaterial({
      color: 0x8d79d9,
      size: isMobile ? 0.065 : 0.055,
      transparent: true,
      opacity: 0.94,
      depthWrite: false,
      blending: THREE.NormalBlending
    });

    const particles = new THREE.Points(
      geometry,
      material
    );

    scene.add(particles);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setClearColor(
      0x000000,
      1
    );

    document.body.appendChild(renderer.domElement);

    function createTextTargets(text) {

      const canvas =
        document.createElement("canvas");

      const ctx =
        canvas.getContext("2d");

      const width =
        isMobile ? 1400 : 2200;

      const height =
        isMobile ? 500 : 650;

      canvas.width = width;
      canvas.height = height;

      let fontSize =
        isMobile ? 190 : 260;

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font =
        "700 " +
        fontSize +
        "px Arial";

      const maxTextWidth =
        width * 0.88;

      while (
        ctx.measureText(text).width >
        maxTextWidth &&
        fontSize > 35
      ) {
        fontSize -= 4;

        ctx.font =
          "700 " +
          fontSize +
          "px Arial";
      }

      ctx.fillStyle = "#ffffff";

      ctx.fillText(
        text,
        width / 2,
        height / 2
      );

      const imageData =
        ctx.getImageData(
          0,
          0,
          width,
          height
        );

      const data =
        imageData.data;

      const points = [];

      const sampleRate =
        isMobile ? 1.55 : 1.7;

      for (
        let y = 0;
        y < height;
        y += sampleRate
      ) {

        for (
          let x = 0;
          x < width;
          x += sampleRate
        ) {

          const px =
            Math.floor(x);

          const py =
            Math.floor(y);

          const index =
            (py * width + px) * 4;

          if (
            data[index + 3] > 100 &&
            Math.random() < 0.86
          ) {

            points.push({
              x: x,
              y: y
            });

          }
        }
      }

      const result =
        new Float32Array(
          particleCount * 3
        );

      const xScale = 10.5;
      const yScale = 10.5;

      const fitScale =
        isMobile ? 0.82 : 0.92;

      if (points.length === 0) {
        return new Float32Array(
          positions
        );
      }

      for (
        let i = 0;
        i < particleCount;
        i++
      ) {

        let point;

        if (
          points.length >= particleCount
        ) {

          const pointIndex =
            Math.floor(
              i *
              points.length /
              particleCount
            );

          point =
            points[pointIndex];

        } else {

          point =
            points[
              i % points.length
            ];

        }

        const i3 = i * 3;

        const normalizedX =
          (point.x - width / 2) /
          width;

        const normalizedY =
          (height / 2 - point.y) /
          height;

        result[i3] =
          normalizedX *
          xScale *
          fitScale;

        result[i3 + 1] =
          normalizedY *
          yScale *
          fitScale;

        result[i3 + 2] =
          (Math.random() - 0.5) *
          0.22;
      }

      return result;
    }

    function createText() {

      const text =
        input.value.trim();

      if (!text) return;

      currentText = text;

      exportButton.disabled = false;

      textTargets =
        createTextTargets(text);

      morphing = true;

      status.textContent =
        "MORPHING";

      if (returnTimer) {
        clearTimeout(returnTimer);
      }

      gsap.to(material, {
        opacity: 0.78,
        duration: 0.45,
        ease: "power2.out"
      });

      gsap.to(
        geometry.attributes.position.array,
        {
          duration: 1.45,
          ease: "power3.inOut",
          endArray: textTargets,

          onUpdate: function() {
            geometry.attributes.position.needsUpdate = true;
          },

          onComplete: function() {

            morphing = false;

            status.textContent =
              "TEXT";
          }
        }
      );

      returnTimer =
        setTimeout(
          returnToSphere,
          7000
        );
    }

    function returnToSphere() {

      if (!textTargets) return;

      morphing = true;

      status.textContent =
        "RETURNING";

      gsap.to(
        geometry.attributes.position.array,
        {
          duration: 1.45,
          ease: "power3.inOut",
          endArray: positions,

          onUpdate: function() {
            geometry.attributes.position.needsUpdate = true;
          },

          onComplete: function() {

            morphing = false;

            status.textContent =
              "SPHERE";

            gsap.to(material, {
              opacity: 0.94,
              duration: 0.45,
              ease: "power2.out"
            });
          }
        }
      );
    }

    function getExportFilename() {

      if (!currentText) {
        return null;
      }

      const valid =
        /^[A-Za-z0-9 _-]+$/.test(
          currentText
        );

      const filenameText =
        valid
          ? currentText
          : "xxx";

      return (
        "Morphing Sphere — " +
        filenameText +
        ".png"
      );
    }

    /*
     * PNG EXPORT
     *
     * This deliberately does NOT use:
     *
     * URL.createObjectURL()
     * window.open(blobURL)
     *
     * Those approaches cause problems with
     * Android 9 / Acode.
     *
     * Instead, the rendered canvas becomes a
     * PNG Blob, then Android's native sharing
     * system receives the actual PNG File.
     */

    function exportTextImage() {

      if (
        !currentText ||
        !textTargets
      ) {
        return;
      }

      const filename =
        getExportFilename();

      if (!filename) {
        return;
      }

      exportButton.disabled = true;
      exportButton.textContent =
        "PNG...";

      const exportWidth = 1600;
      const exportHeight = 900;

      const exportScene =
        new THREE.Scene();

      exportScene.background =
        new THREE.Color(0x000000);

      const exportPositions =
        new Float32Array(
          textTargets
        );

      const exportGeometry =
        new THREE.BufferGeometry();

      exportGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
          exportPositions,
          3
        )
      );

      const exportMaterial =
        new THREE.PointsMaterial({
          color: 0x8d79d9,
          size:
            window.innerWidth < 600
              ? 0.065
              : 0.055,
          transparent: true,
          opacity: 0.78,
          depthWrite: false,
          blending: THREE.NormalBlending
        });

      const exportParticles =
        new THREE.Points(
          exportGeometry,
          exportMaterial
        );

      exportParticles.rotation.set(
        0,
        0,
        0
      );

      exportScene.add(
        exportParticles
      );

      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;

      for (
        let i = 0;
        i < exportPositions.length;
        i += 3
      ) {

        const x =
          exportPositions[i];

        const y =
          exportPositions[i + 1];

        if (x < minX) {
          minX = x;
        }

        if (x > maxX) {
          maxX = x;
        }

        if (y < minY) {
          minY = y;
        }

        if (y > maxY) {
          maxY = y;
        }
      }

      const textWidth =
        Math.max(
          maxX - minX,
          1
        );

      const textHeight =
        Math.max(
          maxY - minY,
          1
        );

      const centerX =
        (minX + maxX) / 2;

      const centerY =
        (minY + maxY) / 2;

      const aspect =
        exportWidth /
        exportHeight;

      const padding = 1.28;

      const halfHeight =
        Math.max(
          textHeight / 2,
          textWidth /
            (2 * aspect)
        ) *
        padding;

      const halfWidth =
        halfHeight *
        aspect;

      const exportCamera =
        new THREE.OrthographicCamera(
          -halfWidth,
          halfWidth,
          halfHeight,
          -halfHeight,
          0.1,
          100
        );

      exportCamera.position.set(
        centerX,
        centerY,
        30
      );

      exportCamera.lookAt(
        centerX,
        centerY,
        0
      );

      const exportRenderer =
        new THREE.WebGLRenderer({
          antialias: true,
          alpha: false,
          preserveDrawingBuffer: true
        });

      exportRenderer.setPixelRatio(1);

      exportRenderer.setSize(
        exportWidth,
        exportHeight,
        false
      );

      exportRenderer.setClearColor(
        0x000000,
        1
      );

      exportRenderer.render(
        exportScene,
        exportCamera
      );

      function cleanup() {

        exportGeometry.dispose();

        exportMaterial.dispose();

        exportRenderer.dispose();

        exportButton.disabled =
          false;

        exportButton.textContent =
          "↓ PNG";
      }

      try {

        exportRenderer.domElement.toBlob(
          async function(blob) {

            if (!blob) {

              cleanup();

              alert(
                "PNG export failed."
              );

              return;
            }

            try {

              /*
               * Turn the PNG Blob into a real
               * File with the requested filename.
               */
              const file =
                new File(
                  [blob],
                  filename,
                  {
                    type:
                      "image/png"
                  }
                );

              /*
               * Android Chrome and other modern
               * browsers can send the actual file
               * to the native share/save interface.
               */
              if (
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                  files: [file]
                })
              ) {

                await navigator.share({
                  files: [file],
                  title: filename
                });

                cleanup();

                return;
              }

              /*
               * Fallback for browsers without
               * file sharing support.
               *
               * Still no blob: URL.
               */
              const reader =
                new FileReader();

              reader.onload =
                function() {

                  const dataURL =
                    reader.result;

                  const link =
                    document.createElement(
                      "a"
                    );

                  link.href =
                    dataURL;

                  link.download =
                    filename;

                  link.rel =
                    "noopener";

                  link.style.display =
                    "none";

                  document.body.appendChild(
                    link
                  );

                  link.click();

                  document.body.removeChild(
                    link
                  );

                  cleanup();
                };

              reader.onerror =
                function() {

                  cleanup();

                  alert(
                    "PNG export could not be prepared."
                  );
                };

              reader.readAsDataURL(
                blob
              );

            } catch (error) {

              console.log(
                "PNG share cancelled or unavailable:",
                error
              );

              cleanup();
            }
          },
          "image/png"
        );

      } catch (error) {

        console.error(
          "PNG export failed:",
          error
        );

        cleanup();

        alert(
          "PNG export could not be created."
        );
      }
    }

    createButton.addEventListener(
      "click",
      createText
    );

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {
          createText();
        }
      }
    );

    exportButton.addEventListener(
      "click",
      exportTextImage
    );

    /*
     * Mouse-wheel zoom
     */

    const MIN_ZOOM = 10;
    const MAX_ZOOM = 78;

    window.addEventListener(
      "wheel",
      function(event) {

        event.preventDefault();

        const amount =
          Math.exp(
            event.deltaY * 0.0012
          );

        zoom *= amount;

        zoom =
          Math.max(
            MIN_ZOOM,
            Math.min(
              MAX_ZOOM,
              zoom
            )
          );

        camera.position.z =
          zoom;

      },
      {
        passive: false
      }
    );

    /*
     * Pinch zoom
     */

    let lastPinchDistance = null;

    function getTouchDistance(
      touches
    ) {

      const dx =
        touches[0].clientX -
        touches[1].clientX;

      const dy =
        touches[0].clientY -
        touches[1].clientY;

      return Math.sqrt(
        dx * dx +
        dy * dy
      );
    }

    window.addEventListener(
      "touchstart",
      function(event) {

        if (
          event.touches.length === 2
        ) {

          lastPinchDistance =
            getTouchDistance(
              event.touches
            );
        }
      },
      {
        passive: false
      }
    );

    window.addEventListener(
      "touchmove",
      function(event) {

        if (
          event.touches.length !== 2 ||
          lastPinchDistance === null
        ) {
          return;
        }

        event.preventDefault();

        const distance =
          getTouchDistance(
            event.touches
          );

        if (distance <= 0) {
          return;
        }

        const scale =
          lastPinchDistance /
          distance;

        zoom *= scale;

        zoom =
          Math.max(
            MIN_ZOOM,
            Math.min(
              MAX_ZOOM,
              zoom
            )
          );

        camera.position.z =
          zoom;

        lastPinchDistance =
          distance;

      },
      {
        passive: false
      }
    );

    window.addEventListener(
      "touchend",
      function(event) {

        if (
          event.touches.length < 2
        ) {
          lastPinchDistance =
            null;
        }
      },
      {
        passive: false
      }
    );

    /*
     * Resize
     */

    window.addEventListener(
      "resize",
      function() {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          Math.min(
            window.devicePixelRatio,
            2
          )
        );
      }
    );

    /*
     * Animation
     */

    function animate() {

      requestAnimationFrame(
        animate
      );

      if (!morphing) {

        particles.rotation.y +=
          0.0016;

        particles.rotation.x +=
          0.00035;
      }

      renderer.render(
        scene,
        camera
      );
    }

    animate();
  </script>

</body>
</html>
